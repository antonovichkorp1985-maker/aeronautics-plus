name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Fetch Create Aeronautics + Ponder/Flywheel/Registrate (compile targets)
        run: |
          mkdir -p libs
          curl -sL "https://cdn.modrinth.com/data/oWaK0Q19/versions/44pLdPGg/create-aeronautics-bundled-1.21.1-1.3.2.jar" -o /tmp/ca-bundled.jar
          curl -sL "https://cdn.modrinth.com/data/LNytGWDc/versions/UjX6dr61/create-1.21.1-6.0.10.jar" -o /tmp/create.jar
          python3 - <<'PY'
          import zipfile
          ca = zipfile.ZipFile('/tmp/ca-bundled.jar')
          inner = [n for n in ca.namelist() if n.endswith('.jar') and 'aeronautics' in n][0]
          open('libs/create-aeronautics-inner-1.3.2.jar', 'wb').write(ca.read(inner))
          print('extracted:', inner)
          cr = zipfile.ZipFile('/tmp/create.jar')
          for n in cr.namelist():
              if n.startswith('META-INF/jarjar/') and n.endswith('.jar'):
                  out = 'libs/' + n.rsplit('/', 1)[1].replace('+mc1.21.1', '').replace('+67', '')
                  open(out, 'wb').write(cr.read(n))
                  print('extracted:', n, '->', out)
          PY
      - name: Build
        run: gradle build --no-daemon
      - name: Create GitHub Release with jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file - <<'EOF'
          ## Aeronautics Plus v0.2.0 — семейство авиационных винтов (Э3)

          Авиа-комплектующие для **Create Aeronautics** (MC 1.21.1, NeoForge 21.1.251+, Java 21).

          ### Что внутри
          - **9 авиационных винтов**: дерево / алюминий / сталь × 2, 3 и 4 лопасти
          - Все винты наследуют `BasePropellerBlock` Create Aeronautics — дружат с подшипниками, гаечным ключом, пондерами и физикой Sable
          - Тяга / airflow / радиус задаются per-spec (`PropellerSpec`) — дальше балансируются в тест-мире
          - Прототипный винт (Э2, v0.1) остаётся в моде
          - Блокстейты, модели, текстуры (свои, 16×16), локализации en/ru, вкладка в креативе

          ### Установка
          Требуется: Minecraft 1.21.1 + NeoForge ≥ 21.1.251 + Create Aeronautics ≥ 1.3.2. Jar кинуть в `mods/`.

          ### Дорожная карта
          Э1 каркас ✓ → Э2 прототипный винт ✓ → **Э3 семейство винтов ✓ (этот релиз)** → Э4 несущие/рулевые винты → Э5 крылья/рули → Э6 реактивная интеграция.

          Jar собран CI из тега `${{ github.ref_name }}` (workflow `release.yml`).
          EOF
