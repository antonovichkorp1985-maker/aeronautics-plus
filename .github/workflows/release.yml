name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Validate resources and data
        run: python3 scripts/validate_resources.py
      - name: Fetch Create Aeronautics + Ponder/Flywheel/Registrate (compile targets)
        run: |
          mkdir -p libs
          curl -sL "https://cdn.modrinth.com/data/oWaK0Q19/versions/44pLdPGg/create-aeronautics-bundled-1.21.1-1.3.2.jar" -o /tmp/ca-bundled.jar
          curl -sL "https://cdn.modrinth.com/data/LNytGWDc/versions/UjX6dr61/create-1.21.1-6.0.10.jar" -o /tmp/create.jar
          python3 - <<'PY'
          import zipfile
          ca = zipfile.ZipFile('/tmp/ca-bundled.jar')
          inner = [n for n in ca.namelist() if n.endswith('.jar') and 'aeronautics' in n][0]
          open('libs/create-aeronautics-inner-1.3.2.jar', 'wb').write(ca.read(inner))
          print('extracted:', inner)
          cr = zipfile.ZipFile('/tmp/create.jar')
          for n in cr.namelist():
              if n.startswith('META-INF/jarjar/') and n.endswith('.jar'):
                  out = 'libs/' + n.rsplit('/', 1)[1].replace('+mc1.21.1', '').replace('+67', '')
                  open(out, 'wb').write(cr.read(n))
                  print('extracted:', n, '->', out)
          PY
      - name: Validate RU pack against Create 6.0.10
        run: |
          python3 scripts/validate_create_localization.py \
            --jar /tmp/create.jar \
            --resource-pack localization/ru-pack
      - name: Build
        run: gradle build --no-daemon
      - name: Create GitHub Release with jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-test.* || "$GITHUB_REF_NAME" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --verify-tag \
            --title "Aeronautics Plus $GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}"
