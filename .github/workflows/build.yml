name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
        with:
          # ModDevGradle 2.x совместим с Gradle 8.x; не даём поставить 9-ю
          gradle-version: '8.9'
      - name: Fetch Create Aeronautics (compile target)
        run: |
          mkdir -p libs
          curl -sL "https://cdn.modrinth.com/data/oWaK0Q19/versions/44pLdPGg/create-aeronautics-bundled-1.21.1-1.3.2.jar" -o /tmp/ca-bundled.jar
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('/tmp/ca-bundled.jar')
          inner = [n for n in z.namelist() if n.endswith('.jar') and 'aeronautics' in n][0]
          open('libs/create-aeronautics-inner-1.3.2.jar', 'wb').write(z.read(inner))
          print('extracted:', inner)
          PY
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aeronauticsplus-jars
          path: build/libs/*.jar
