name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # ModDevGradle 2.x совместим с Gradle 8.x; не даём поставить 9-ю
          gradle-version: '8.9'
      - name: Validate resources and data
        run: python3 scripts/validate_resources.py
      - name: Fetch Create Aeronautics + Ponder/Flywheel/Registrate (compile targets)
        run: |
          mkdir -p libs
          curl -sL "https://cdn.modrinth.com/data/oWaK0Q19/versions/44pLdPGg/create-aeronautics-bundled-1.21.1-1.3.2.jar" -o /tmp/ca-bundled.jar
          curl -sL "https://cdn.modrinth.com/data/LNytGWDc/versions/UjX6dr61/create-1.21.1-6.0.10.jar" -o /tmp/create.jar
          python3 - <<'PY'
          import zipfile
          ca = zipfile.ZipFile('/tmp/ca-bundled.jar')
          inner = [n for n in ca.namelist() if n.endswith('.jar') and 'aeronautics' in n][0]
          open('libs/create-aeronautics-inner-1.3.2.jar', 'wb').write(ca.read(inner))
          print('extracted:', inner)
          cr = zipfile.ZipFile('/tmp/create.jar')
          for n in cr.namelist():
              if n.startswith('META-INF/jarjar/') and n.endswith('.jar'):
                  out = 'libs/' + n.rsplit('/', 1)[1].replace('+mc1.21.1', '').replace('+67', '')
                  open(out, 'wb').write(cr.read(n))
                  print('extracted:', n, '->', out)
          PY
      - name: Validate RU pack against Create Deep Seas 2.2.4
        run: |
          curl -sL "https://cdn.modrinth.com/data/mva5q4qZ/versions/UcXaPVeD/create_submarine-2.2.4.jar" -o /tmp/create-submarine.jar
          echo "fb4902c2ca3463ea3016efbae7011408eb008d89  /tmp/create-submarine.jar" | sha1sum --check
          python3 scripts/validate_deep_seas_localization.py \
            --jar /tmp/create-submarine.jar \
            --resource-pack localization/ru-pack
      - name: Validate RU pack against Sable 2.0.5
        run: |
          curl -sL "https://api.modrinth.com/maven/maven/modrinth/sable/2.0.5+mc1.21.1/sable-2.0.5+mc1.21.1.jar" -o /tmp/sable.jar
          echo "05f666e973d32baaaf405acb9bbed6615b909971  /tmp/sable.jar" | sha1sum --check
          python3 scripts/validate_sable_localization.py \
            --jar /tmp/sable.jar \
            --resource-pack localization/ru-pack
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: aeronauticsplus-jars
          path: build/libs/*.jar
