Aircraft parts addon for Create Aeronautics. Create Propulsion: Simulated / More Propulsion already provide generic jet engines, so this addon focuses on aircraft parts and compatibility instead of duplicating them. Code: MIT. Assets: our own (no CA/VW assets reused).'''

