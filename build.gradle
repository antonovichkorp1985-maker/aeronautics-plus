plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '0.1.0'
group = 'dev.leeeonidys'
base { archivesName = 'aeronauticsplus' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
    // Create Aeronautics (bundled jar) для compileOnly
    maven { url = 'https://api.modrinth.com/maven' }
}

neoForge {
    version = '21.1.251'

    runs {
        client { client() }
    }

    mods {
        aeronauticsplus { sourceSet sourceSets.main }
    }
}

dependencies {
    // Create Aeronautics: код MIT — компилируемся против их публичных классов
    // (BasePropellerBlock / BasePropellerBlockEntity / PropellerActorBehaviour).
    // Ассеты CA — All Rights Reserved: их текстуры/модели НЕ копируем.
    compileOnly "maven.modrinth:create-aeronautics:1.3.2+mc1.21.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
