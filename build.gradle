plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '0.1.0'
group = 'dev.leeeonidys'
base { archivesName = 'aeronauticsplus' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    neoForge "net.neoforged:neoforge:21.1.251"
    // Create Aeronautics (bundled) — компилируемся против их публичных классов (код MIT).
    // Ассеты CA — All Rights Reserved: их текстуры/модели НЕ копируем.
    compileOnly "maven.modrinth:create-aeronautics:1.3.2"
}

neoForge {
    runs {
        client { client() }
    }
    mods {
        aeronauticsplus { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
